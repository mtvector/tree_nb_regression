[build-system]
requires = ["setuptools==71.0.4", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-nb-regression"
version = "0.1.0"
description = "Exploratory tree-structured pseudobulk negative-binomial regression"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anndata==0.13.2",
    "numpy==2.1.1",
    "pandas==2.3.3",
    "scipy==1.18.0",
    "torch==2.4.0",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "nbstripout==0.9.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools]
packages = ["tree_nb_regression"]

[tool.setuptools.package-dir]
tree_nb_regression = "."

[tool.pytest.ini_options]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: end-to-end simulation calibration gate",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "__init__.py",
    "calibration.py",
    "burden_inference.py",
    "burden_calibration.py",
    "eb_calibration.py",
    "honest_inference.py",
    "inference.py",
    "l1_tuning.py",
    "model.py",
    "pseudobulk.py",
    "results.py",
    "species_tree.py",
    "taxonomy_tree.py",
]
exclude = ["build", "notebooks", "tests"]
ignore_missing_imports = true
cache_dir = "/scratch/mypy_cache"
disable_error_code = ["attr-defined", "no-untyped-call", "type-arg"]
